<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kompetenz-Übersetzer · Future Skills Hub Thurgau</title>
<style>
:root{
  --ink:#1a1a1a; --muted:#5f5f5a; --line:#e2e0d8; --line2:#cfcdc3; --bg:#f4f3ee; --card:#fff;
  --focus:#1d5fbf;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:"Segoe UI",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45;}
button,select,input,textarea{font-family:inherit;font-size:inherit;}
button{cursor:pointer;}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;}

.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--line2);position:sticky;top:0;z-index:20;flex-wrap:wrap;}
.brand strong{font-size:18px;display:block;}
.brand .sub{font-size:12.5px;color:var(--muted);}
.tabs{display:flex;gap:6px;flex-wrap:wrap;}
.tab{border:1px solid var(--line2);background:#f6f5f1;border-radius:999px;padding:7px 16px;font-size:14px;color:#3d3d39;}
.tab[aria-current="page"]{background:var(--ink);color:#fff;border-color:var(--ink);}

.bar{display:flex;align-items:center;gap:12px;padding:10px 20px;background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap;}
.bar .lbl{font-size:13px;color:var(--muted);font-weight:600;}
.seg{display:flex;gap:4px;flex-wrap:wrap;}
.seg button{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:7px 13px;font-size:14px;}
.seg button[aria-pressed="true"]{background:#1a1a1a;color:#fff;border-color:#1a1a1a;}
.status{margin-left:auto;font-size:12.5px;color:var(--muted);}

main{max-width:1180px;margin:0 auto;padding:18px 20px 80px;}
.hint{background:#fff8e6;border:1px solid #ecd9a6;border-radius:10px;padding:10px 14px;font-size:13.5px;margin-bottom:14px;}
.hint b{font-weight:600;}

/* Bereiche + Kacheln */
.area{margin-bottom:22px;}
.areahead{display:flex;align-items:baseline;gap:10px;margin:0 0 8px;flex-wrap:wrap;}
.areahead h2{margin:0;font-size:17px;color:var(--c);letter-spacing:.04em;}
.areahead .u{font-size:13.5px;color:var(--muted);}
.areahead .m{font-size:12px;color:var(--muted);margin-left:auto;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;}
.tile{perspective:900px;}
.tilebtn{all:unset;box-sizing:border-box;display:block;width:100%;height:100%;cursor:pointer;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:12px;padding:14px 14px 12px;transition:box-shadow .12s, transform .35s;transform-style:preserve-3d;}
.tilebtn:hover{box-shadow:0 2px 10px rgba(0,0,0,.08);}
.tilebtn:focus-visible{outline:3px solid var(--focus);outline-offset:2px;}
.tilebtn.flip{animation:flip .35s ease;}
@keyframes flip{0%{transform:rotateY(0)}50%{transform:rotateY(90deg)}100%{transform:rotateY(0)}}
.tile h3{margin:0 0 6px;font-size:15.5px;}
.tile .du{font-size:14px;color:#33332f;}
.tile ul{margin:4px 0 0;padding-left:18px;font-size:13.5px;}
.tile .small{font-size:12px;color:var(--muted);margin-top:8px;}
.chip{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px;margin:0 4px 4px 0;}
.chip.entwurf{background:#fff1cc;color:#7a5a00;}
.chip.neu{background:#e3eefb;color:#1d4f8f;}
.chip.meta{background:#ecebe6;color:#3d3d39;}
.chip.besch{background:#e2f2e7;color:#1f6b40;}
.maprow{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;margin:4px 0;}
.sym{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;border-radius:6px;font-weight:700;font-size:13px;flex:none;}
.sym.entspricht{background:#e2f2e7;color:#1f6b40;}
.sym.traegt_bei{background:#e3eefb;color:#1d4f8f;}
.sym.keine{background:#f1efea;color:#6b6b66;}
.dim{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:6px;}
.disclaim{font-size:12px;color:#6b4e00;background:#fff8e6;border-radius:8px;padding:6px 9px;margin-top:8px;}

/* Detail */
.detail{background:var(--card);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:14px;overflow:hidden;}
.dhead{display:flex;align-items:flex-start;gap:12px;padding:16px 20px;background:var(--cbg);flex-wrap:wrap;}
.dhead h2{margin:0;font-size:21px;flex:1;min-width:240px;}
.dhead .du{font-size:15px;margin-top:6px;font-weight:400;}
.back{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:8px 14px;font-size:14px;}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:0;}
.col{padding:16px 20px;border-top:1px solid var(--line);}
.col+.col{border-left:1px solid var(--line);}
.col h3{margin:0 0 2px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);}
.col .q{font-size:17px;font-weight:600;margin:0 0 10px;}
.mapcard{border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:8px;}
.mapcard .t{font-weight:600;font-size:14.5px;}
.mapcard .b{font-size:13px;color:var(--muted);margin-top:3px;}
.zyk{display:flex;gap:4px;margin-bottom:8px;}
.zyk button{border:1px solid var(--line2);background:#fff;border-radius:7px;padding:4px 10px;font-size:13px;}
.zyk button[aria-pressed="true"]{background:#1a1a1a;color:#fff;border-color:#1a1a1a;}
.section{padding:16px 20px;border-top:1px solid var(--line);}
.section h3{margin:0 0 8px;font-size:15px;}
.fb{background:#f8f7f3;border-radius:9px;padding:9px 12px;margin-bottom:7px;font-size:14px;}
.fb .meta{font-size:12px;color:var(--muted);}
form.rm{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;max-width:760px;}
form.rm label{display:flex;flex-direction:column;font-size:13px;color:#3d3d39;gap:4px;}
form.rm .full{grid-column:1/-1;}
form.rm input,form.rm select,form.rm textarea{border:1px solid var(--line2);border-radius:8px;padding:8px 10px;background:#fff;font-size:14px;}
form.rm textarea{min-height:80px;resize:vertical;}
.primary{background:#1a1a1a;color:#fff;border:0;border-radius:8px;padding:9px 16px;font-size:14px;}
.msg{font-size:13.5px;margin-top:6px;}

/* Beruf + Matrix */
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin-bottom:14px;}
.panel h2{margin:0 0 4px;font-size:19px;}
.panel .sub{font-size:13.5px;color:var(--muted);}
.brow{display:grid;grid-template-columns:minmax(220px,1fr) 2fr;gap:12px;padding:9px 0;border-top:1px solid var(--line);align-items:start;}
.brow .begr{font-weight:600;font-size:14.5px;}
.bl{display:flex;flex-wrap:wrap;gap:6px;}
.bpill{border:1px solid var(--line2);background:#fff;border-left:4px solid var(--c);border-radius:8px;padding:4px 9px;font-size:13px;display:inline-flex;gap:6px;align-items:center;}
.gap{font-size:13px;color:#8a3b3b;font-style:italic;}
.tblwrap{overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;}
table.mx{border-collapse:collapse;font-size:13px;min-width:900px;}
table.mx th,table.mx td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:center;}
table.mx th{position:sticky;top:0;background:#faf9f6;font-weight:600;font-size:12px;}
table.mx th.v{writing-mode:vertical-rl;transform:rotate(180deg);height:150px;white-space:nowrap;text-align:left;}
table.mx td.l,table.mx th.l{text-align:left;white-space:nowrap;}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:10px 0;align-items:center;}
.about p,.about li{font-size:14.5px;max-width:820px;}
footer{font-size:12px;color:var(--muted);text-align:center;padding:24px 20px;}
@media (max-width:820px){.cols{grid-template-columns:1fr}.col+.col{border-left:0}form.rm{grid-template-columns:1fr}.brow{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.tilebtn.flip{animation:none}}
/* --- Stufe 1 --- */
.rolepick{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);}
.rolepick select{border:1px solid var(--line2);border-radius:999px;padding:7px 12px;font-size:14px;background:#fff8d6;color:var(--ink);font-weight:600;}
.rolehint{background:#fff8d6;border-bottom:1px solid #ecd9a6;padding:8px 20px;font-size:13.5px;}
.rolehint b{font-weight:600;}
.speak{border:1px solid var(--line2);background:#fff;border-radius:999px;padding:3px 9px;font-size:12px;margin-top:6px;}
.tile{display:flex;flex-direction:column;align-items:flex-start;}
.tile .tilebtn{flex:1;}
main:focus{outline:none;}
.offers{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;}
.offer{all:unset;box-sizing:border-box;cursor:pointer;display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;transition:box-shadow .12s;}
.offer:hover{box-shadow:0 2px 10px rgba(0,0,0,.08);}
.offer:focus-visible{outline:3px solid var(--focus);outline-offset:2px;}
.offer h3{margin:4px 0 4px;font-size:16.5px;}
.offer .anb{font-size:13px;color:var(--muted);}
.offer .kurz{font-size:14px;margin:8px 0;}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;}
.fact{font-size:12px;background:#f1efea;border-radius:6px;padding:3px 8px;}
.siegel{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:3px 9px;border-radius:999px;}
.siegel.gelistet{background:#efeee9;color:#55554f;}
.siegel.deklariert{background:#e3eefb;color:#1d4f8f;}
.siegel.geprüft{background:#e2f2e7;color:#1f6b40;}
.bsp{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:3px 8px;border-radius:999px;background:#fbe9e9;color:#8a3b3b;}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0 4px;}
.kpi{background:#f8f7f3;border-radius:10px;padding:10px 12px;}
.kpi .k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;}
.kpi .v{font-size:15px;font-weight:600;margin-top:2px;}
.kpi.hl{background:#fff8d6;}
.phases{display:flex;flex-direction:column;gap:8px;}
.phase{display:grid;grid-template-columns:130px 1fr;gap:12px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;}
.phase .t{font-size:12.5px;color:var(--muted);font-weight:600;}
.phase .n{font-weight:600;}
.phase .e{font-size:13.5px;margin-top:3px;}
.phase .e b{font-weight:600;}
.top3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.t3{border:1px solid var(--line);border-top:4px solid var(--c);border-radius:12px;padding:12px;background:#fff;}
.t3 .rank{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em;}
.t3 h3{margin:4px 0 6px;font-size:15px;}
.t3 .why{font-size:13px;color:#3d3d39;}
.t3 .lo{margin-top:8px;font-size:13px;}
.t3 .lo a{color:var(--focus);cursor:pointer;text-decoration:underline;}
.quelle{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:#f1efea;color:#3d3d39;}
table.list{border-collapse:collapse;width:100%;font-size:13.5px;background:#fff;}
table.list th,table.list td{border-bottom:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top;}
table.list th{background:#faf9f6;font-size:12px;}
.badgepick{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:8px;}
.bp{border:1px solid var(--line);border-radius:10px;padding:8px 10px;}
.bp label{flex-direction:row !important;align-items:center;gap:8px !important;font-weight:600;color:var(--ink) !important;}
.bp textarea{min-height:52px !important;margin-top:6px;width:100%;}
.ph{display:grid;grid-template-columns:120px 1fr 1fr;gap:6px;}
@media (max-width:820px){.top3{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}.phase{grid-template-columns:1fr}.ph{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><strong>Kompetenz-Übersetzer</strong><span class="sub">SBW Future Skills × FSH-Badgeraster × Berufsbildung · Prototyp</span></div>
  <nav class="tabs" id="tabs" aria-label="Ansichten"></nav>
  <div class="rolepick"><label for="role">Rolle (Demo)</label><select id="role"></select></div>
</header>
<div class="rolehint" id="rolehint"></div>
<div class="bar" id="bar"></div>
<main id="main" tabindex="-1"></main>
<footer>Future Skills Hub Thurgau · Prototyp · SBW Future Skills™ © SBW Haus des Lernens · Badgeraster: FSH Anhang A · Alle Lernort-Angebote mit «Beispiel» sind erfunden.</footer>

<script src="daten.js"></script>
<script>
const D = window.DATEN;
const ROLES = {
  jugend:     { name: "Jugendliche",          lesart: "du",      views: ["wand", "lernorte"],                       hint: "Du siehst, was die Badges bedeuten und wo du sie ausserhalb der Schule üben kannst. Tipp: Lass dir die Kacheln vorlesen oder schalte «Einfache Sprache» ein." },
  lehrperson: { name: "Lehrperson",           lesart: "schule",  views: ["wand", "lernorte", "beruf", "matrix"],   hint: "Indikatoren für Zyklus 2 und 3, passende Lernorte für eure Klasse und der Anschluss an die Berufsbildung." },
  anbieter:   { name: "Lernort-Anbieter",     lesart: "schule",  views: ["lernorte", "erfassen", "wand"],          hint: "Erfassen Sie Ihr Angebot und begründen Sie, welche Badges es anspricht. Das Kuratorium prüft und vergibt das Siegel." },
  betrieb:    { name: "Betrieb / KMU",        lesart: "betrieb", views: ["beruf", "wand", "lernorte"],             hint: "Wählen Sie einen Beruf: Sie sehen die drei Badges, die am meisten einzahlen, und Lernorte, die sie fördern." },
  kuratorium: { name: "Kuratorium",           lesart: "schule",  views: ["zuordnungen", "matrix", "lernorte", "wand", "beruf"], hint: "Steuerhoheit: Zuordnungen, Rückmeldungen und Angebote werden in der Airtable-Base entschieden. Hier sehen Sie den Stand." }
};
const VIEWS = { wand: "Kachelwand", lernorte: "Lernorte", erfassen: "Angebot erfassen", beruf: "Berufsansicht", matrix: "Matrix", zuordnungen: "Zuordnungen", transparenz: "Transparenz" };
const S = { role: "lehrperson", view: "wand", lesart: "schule", zyklus: "z3", bereich: "alle", badge: null, angebot: null, beruf: "hotellerie", einfach: false, lzyk: "alle", lbadge: "alle", zstatus: "alle", source: "lädt …" };
let ZUO = D.zuordnungen.slice();
let ANG = D.angebote.slice();
let RM = [];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const area = id => D.bereiche.find(b => b.id === id);
const sbwById = id => D.sbw.find(x => x.id === id);
const badgeById = id => D.badges.find(x => x.id === id);
const dimOf = b => (D.begriffe.find(x => x.b === b) || {}).d || "–";
const SYM = { entspricht: "=", traegt_bei: "→", keine: "∅" };
const TYPTXT = { entspricht: "entspricht", traegt_bei: "trägt bei zu", keine: "keine Entsprechung" };
const DISCLAIM = "Ein Badge aus einem Workshop belegt eine beobachtete Handlung in einer konkreten Situation. Es ist kein Qualifikationsnachweis im Sinne der Bildungsverordnung.";
const maps = (badge, ebene) => ZUO.filter(z => z.badge === badge && z.ebene === ebene);
const statusChip = s => s === "beschlossen" ? '<span class="chip besch">beschlossen</span>' : '<span class="chip entwurf">' + esc(s || "Entwurf") + '</span>';
const quelleChip = q => `<span class="quelle" title="Quelle der Zuordnung">Quelle: ${esc(q || "Kuratorium")}</span>`;
const sym = t => `<span class="sym ${t}" title="${TYPTXT[t]}" aria-label="${TYPTXT[t]}">${SYM[t]}</span>`;
const siegelChip = s => `<span class="siegel ${esc(s)}" title="${esc(D.siegel[s] || "")}">Siegel: ${esc(s)}</span>`;
const angeboteFuer = badgeId => ANG.filter(a => a.badges.some(b => b[0] === badgeId));
const duText = b => (S.einfach && b.einfach) ? b.einfach : b.du;
const badgeName = id => (badgeById(id) || {}).titel || id;

// ---------- Vorlesen (Browser-Sprachausgabe, kein externer Dienst) ----------
function speak(text) {
  try {
    if (!("speechSynthesis" in window)) return alertMsg("Vorlesen wird von diesem Browser nicht unterstützt.");
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const v = speechSynthesis.getVoices().find(v => /^de-CH/i.test(v.lang)) || speechSynthesis.getVoices().find(v => /^de/i.test(v.lang));
    if (v) u.voice = v; u.lang = v ? v.lang : "de-CH"; u.rate = 0.95;
    speechSynthesis.speak(u);
  } catch (e) {}
}
function alertMsg(t) { const h = $("#rolehint"); h.innerHTML = esc(t); }

// ---------- Laden ----------
async function getJSON(op) { const r = await fetch("/api/data?op=" + op); return r.json(); }
async function load() {
  try {
    const d = await getJSON("zuordnungen");
    if (d.fallback) S.source = "Demo-Daten (Airtable nicht verbunden)";
    else if (d.zuordnungen) { ZUO = d.zuordnungen; S.source = "Daten aus Airtable"; }
    else S.source = "Fehler – Demo-Daten";
  } catch (e) { S.source = "lokal – Demo-Daten"; }
  try { const d = await getJSON("angebote"); if (d.angebote) ANG = d.angebote; } catch (e) {}
  try { const d = await getJSON("rueckmeldungen"); RM = d.rueckmeldungen || []; } catch (e) { RM = []; }
  render();
}

// ---------- Rollen ----------
const roleSel = $("#role");
roleSel.innerHTML = Object.entries(ROLES).map(([k, r]) => `<option value="${k}">${esc(r.name)}</option>`).join("");
roleSel.onchange = () => setRole(roleSel.value);
function setRole(r) {
  S.role = r; const R = ROLES[r];
  S.lesart = R.lesart; S.view = R.views[0]; S.badge = null; S.angebot = null;
  try { localStorage.setItem("ku-role", r); } catch (e) {}
  render(); $("#main").focus(); window.scrollTo(0, 0);
}
function go(view, extra) { Object.assign(S, { view, badge: null, angebot: null }, extra || {}); render(); $("#main").focus(); window.scrollTo(0, 0); }

function renderTabs() {
  const vs = [...ROLES[S.role].views, "transparenz"];
  $("#tabs").innerHTML = vs.map(v => `<button class="tab" data-view="${v}" aria-current="${S.view === v && !S.badge && !S.angebot ? "page" : "false"}">${VIEWS[v]}</button>`).join("");
  $("#tabs").querySelectorAll("[data-view]").forEach(t => t.onclick = () => go(t.dataset.view));
  roleSel.value = S.role;
  $("#rolehint").innerHTML = `<b>${esc(ROLES[S.role].name)}:</b> ${esc(ROLES[S.role].hint)}`;
}

function seg(name, opts, cur, attr) {
  return `<span class="lbl">${name}</span><div class="seg" role="group" aria-label="${name}">` +
    opts.map(([v, l]) => `<button data-${attr}="${v}" aria-pressed="${v === cur}">${l}</button>`).join("") + `</div>`;
}
function renderBar() {
  const bar = $("#bar");
  let h = "";
  if (S.view === "wand" && !S.badge) {
    h = seg("Lesart", [["du","Für dich"],["schule","Schule"],["sbw","Haltung (SBW)"],["betrieb","Betrieb"]], S.lesart, "lesart") +
      (S.lesart === "schule" ? seg("Zyklus", [["z2","Zyklus 2"],["z3","Zyklus 3"]], S.zyklus, "zyklus") : "") +
      (S.lesart === "du" ? `<div class="seg"><button id="einfach" aria-pressed="${S.einfach}" title="Texte in einfacher Sprache (Entwurf)">Einfache Sprache</button></div>` : "") +
      seg("Bereich", [["alle","alle"], ...D.bereiche.map(b => [b.id, b.name])], S.bereich, "bereich");
  } else if (S.view === "lernorte" && !S.angebot) {
    h = seg("Zyklus", [["alle","alle"],["Zyklus 2","Zyklus 2"],["Zyklus 3","Zyklus 3"]], S.lzyk, "lzyk") +
      `<span class="lbl">Badge</span><select id="lbadge" style="border:1px solid var(--line2);border-radius:8px;padding:6px 10px"><option value="alle">alle</option>${D.badges.map(b => `<option value="${b.id}" ${S.lbadge === b.id ? "selected" : ""}>${esc(b.titel)}</option>`).join("")}</select>`;
  } else if (S.view === "zuordnungen") {
    h = seg("Status", [["alle","alle"],["Entwurf","Entwurf"],["beschlossen","beschlossen"]], S.zstatus, "zstatus");
  }
  bar.innerHTML = h + `<span class="status">${esc(S.source)}</span>`;
  bar.querySelectorAll("[data-lesart]").forEach(b => b.onclick = () => { S.lesart = b.dataset.lesart; render(true); });
  bar.querySelectorAll("[data-zyklus]").forEach(b => b.onclick = () => { S.zyklus = b.dataset.zyklus; render(true); });

    body = `<div class="du">${esc(duText(b))}</div>` + (n ? `<div class="small">${n} Lernort${n > 1 ? "e" : ""} zum Üben</div>` : "");
  } else if (S.lesart === "schule") {
    const ind = b[S.zyklus] || [];
    body = b.meta ? `<div class="du">${esc(b.regel)}</div>` :
      `<div class="dim">Indikatoren ${S.zyklus === "z2" ? "Zyklus 2" : "Zyklus 3"}</div><ul>${ind.map(i => `<li>${esc(i)}</li>`).join("")}</ul>`;
    body += `<div class="small">Lehrplan 21: ${esc(a.lp21)}</div>`;

    const m = maps(b.id, "sbw");
    body = m.length ? m.map(z => z.typ === "keine"
      ? `<div class="maprow">${sym("keine")}<span>keine Entsprechung im SBW-Modell</span></div>`
      : `<div class="maprow">${sym(z.typ)}<span><b>${esc(sbwById(z.ziel)?.name || z.ziel)}</b><br><span class="small">${esc(sbwById(z.ziel)?.ziel || "")}</span></span></div>`).join("")
      : `<div class="maprow">${sym("keine")}<span>noch keine Zuordnung</span></div>`;
  } else {
    const m = maps(b.id, "bivo"); const byDim = {};
    m.forEach(z => { const d = dimOf(z.ziel); (byDim[d] = byDim[d] || []).push(z); });
    body = Object.keys(byDim).length ? Object.entries(byDim).map(([d, zs]) => `<div class="dim">${esc(d)}</div>` +

      : `<div class="maprow">${sym("keine")}<span>noch keine Zuordnung</span></div>`;
  }
  return `<div>${chips}</div><h3>${esc(b.titel)}</h3>${body}`;
}

// ---------- Beruf: Top 3 + Lernorte ----------
function top3(begriffe) {
  const W = { entspricht: 2, traegt_bei: 1 };
  return D.badges.map(b => {
    const hits = ZUO.filter(z => z.badge === b.id && z.ebene === "bivo" && begriffe.includes(z.ziel) && W[z.typ]);
    return { b, hits, w: hits.reduce((s, z) => s + W[z.typ], 0) };
  }).filter(x => x.w > 0).sort((a, c) => c.w - a.w || c.hits.length - a.hits.length).slice(0, 3);
}
function renderBeruf() {
  const be = D.berufe.find(x => x.id === S.beruf);
  const begriffe = be.alle ? D.begriffe.map(x => x.b) : be.begriffe;
  const dims = ["Methodenkompetenz", "Sozial- und Selbstkompetenz", "Fachkompetenz"];
  const t3 = be.alle ? [] : top3(begriffe);
  let h = `<div class="panel"><h2>Berufsansicht</h2><div class="sub">Welche Badges zahlen auf die Handlungskompetenzen eines Berufs ein – und wo können Jugendliche sie ausserschulisch üben?</div>
    <div style="margin-top:12px"><label for="bsel" style="font-size:13px;color:var(--muted);font-weight:600">Beruf </label>
    <select id="bsel" style="border:1px solid var(--line2);border-radius:8px;padding:7px 10px;font-size:14px">${D.berufe.map(x => `<option value="${x.id}" ${x.id === S.beruf ? "selected" : ""}>${esc(x.name)}</option>`).join("")}</select></div>
    <div class="sub" style="margin-top:8px">Quelle: ${esc(be.erlass)}${be.stand ? " · " + esc(be.stand) : ""}${be.alle ? "" : " · Auszug als Beispieldaten – vor Einsatz am Originalerlass prüfen"}</div>
    <div class="disclaim">${DISCLAIM}</div></div>`;
  if (t3.length) {
    h += `<div class="panel"><h2 style="font-size:17px">Top 3 Badges für diesen Beruf</h2><div class="sub" style="margin-bottom:10px">Reihenfolge nach den hinterlegten Zuordnungen («entspricht» vor «trägt bei zu»). Keine Bewertung von Personen.</div><div class="top3">` +
      t3.map((x, i) => { const a = area(x.b.bereich); const los = angeboteFuer(x.b.id);
        return `<div class="t3" style="--c:${a.farbe}"><div class="rank">${i + 1}. · ${esc(a.name)}</div><h3><button class="bpill" style="--c:${a.farbe}" data-badge="${x.b.id}">${esc(x.b.titel)}</button></h3>
          <div class="why">${x.hits.map(z => `${sym(z.typ)} ${esc(z.ziel)}`).join("<br>")}</div>
          <div class="lo"><b>Üben bei:</b> ${los.length ? los.map(o => `<a data-angebot="${esc(o.id)}">${esc(o.titel)}</a>${o.beispiel ? " (Beispiel)" : ""}`).join(", ") : "<i>noch kein Lernort</i>"}</div></div>`; }).join("") + `</div></div>`;
  }
  dims.forEach(d => {
    const bs = begriffe.filter(x => dimOf(x) === d);
    if (!bs.length) return;
    h += `<div class="panel"><h2 style="font-size:16px">${esc(d)}</h2>` + bs.map(begr => {
      const zs = ZUO.filter(z => z.ebene === "bivo" && z.ziel === begr && z.typ !== "keine");
      return `<div class="brow"><div class="begr">${esc(begr)}</div><div class="bl">${zs.length ? zs.map(z => { const b = badgeById(z.badge); if (!b) return ""; const a = area(b.bereich);
        return `<button class="bpill" style="--c:${a.farbe}" data-badge="${b.id}">${sym(z.typ)} ${esc(b.titel)}</button>`; }).join("") : '<span class="gap">Lücke: kein Badge zahlt hier ein</span>'}</div></div>`;
    }).join("") + `</div>`;
  });
  $("#main").innerHTML = h;
  $("#bsel").onchange = e => { S.beruf = e.target.value; renderBeruf(); };
  bindBadgeLinks();
}

// ---------- Matrix ----------
function matrixData() {
  const cols = [...D.sbw.map(s => ({ key: "sbw|" + s.id, label: "SBW: " + s.name })), ...D.begriffe.map(x => ({ key: "bivo|" + x.b, label: x.b }))];
  const rows = D.badges.map(b => ({ b, cells: cols.map(c => { const [e, t] = c.key.split("|"); const z = ZUO.find(z => z.badge === b.id && z.ebene === e && z.ziel === t); return z ? z.typ : ""; }) }));
  return { cols, rows };
}
function renderMatrix() {
  const { cols, rows } = matrixData();
  $("#main").innerHTML = `<div class="panel"><h2>Übersetzungs-Matrix</h2><div class="sub">Badges (Zeilen) × SBW Future Skills und BiVo-Begriffe (Spalten).</div>
    <div class="legend">${sym("entspricht")} entspricht ${sym("traegt_bei")} trägt bei zu <span>Ohne SBW-Entsprechung: ${rows.filter(r => maps(r.b.id, "sbw").some(z => z.typ === "keine")).map(r => esc(r.b.titel)).join(", ") || "–"}</span>
    <button class="back" id="csv" style="margin-left:auto">CSV exportieren</button></div></div>
    <div class="tblwrap"><table class="mx"><thead><tr><th class="l">Badge</th>${cols.map(c => `<th class="v" scope="col">${esc(c.label)}</th>`).join("")}</tr></thead><tbody>` +
    rows.map(r => `<tr><th class="l" scope="row"><button class="bpill" style="--c:${area(r.b.bereich).farbe}" data-badge="${r.b.id}">${esc(r.b.titel)}</button></th>${r.cells.map(t => `<td>${t && t !== "keine" ? sym(t) : ""}</td>`).join("")}</tr>`).join("") +
    `</tbody></table></div>`;
  bindBadgeLinks();
  $("#csv").onclick = () => {
    const q = s => '"' + String(s).replace(/"/g, '""') + '"';
    const lines = [["Badge", "Bereich", ...cols.map(c => c.label)].map(q).join(";"),
      ...rows.map(r => [r.b.titel, area(r.b.bereich).name, ...r.cells.map(t => t ? TYPTXT[t] : "")].map(q).join(";"))];
    const blob = new Blob(["﻿" + lines.join("\n")], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "kompetenz-uebersetzer-matrix.csv"; a.click();
  };
}

// ---------- Kuratorium: Zuordnungen mit Quelle × Status ----------
function renderZuordnungen() {
  const list = ZUO.filter(z => S.zstatus === "alle" || (z.status || "Entwurf") === S.zstatus);
  const offen = RM.filter(r => r.status === "offen").length;
  const cnt = s => ZUO.filter(z => (z.status || "Entwurf") === s).length;
  $("#main").innerHTML = `<div class="panel"><h2>Zuordnungen: Quelle und Status</h2>
    <div class="sub">Jede Zuordnung zeigt, wer sie vorgeschlagen hat und wie weit sie ist. Entschieden wird in der Airtable-Base (Tabellen «Zuordnungen», «Rückmeldungen», «Angebote»).</div>
    <div class="kpis"><div class="kpi"><div class="k">Zuordnungen</div><div class="v">${ZUO.length}</div></div><div class="kpi"><div class="k">Entwurf</div><div class="v">${cnt("Entwurf")}</div></div>
    <div class="kpi"><div class="k">beschlossen</div><div class="v">${cnt("beschlossen")}</div></div><div class="kpi hl"><div class="k">offene Rückmeldungen</div><div class="v">${offen}</div></div></div></div>
    <div class="tblwrap"><table class="list"><thead><tr><th>Badge</th><th>Ebene</th><th>Ziel</th><th>Typ</th><th>Quelle</th><th>Status</th></tr></thead><tbody>
    ${list.map(z => { const b = badgeById(z.badge); const a = b ? area(b.bereich) : null;
      return `<tr><td>${b ? `<button class="bpill" style="--c:${a.farbe}" data-badge="${b.id}">${esc(b.titel)}</button>` : esc(z.badge)}</td><td>${z.ebene === "sbw" ? "SBW" : "BiVo"}</td>
      <td>${esc(z.ebene === "sbw" ? (sbwById(z.ziel)?.name || "–") : z.ziel)}</td><td>${sym(z.typ)} ${TYPTXT[z.typ]}</td><td>${quelleChip(z.quelle)}</td><td>${statusChip(z.status)}</td></tr>`; }).join("")}
    </tbody></table></div>`;
  bindBadgeLinks();
}

// ---------- Transparenz ----------
function renderTransparenz() {
  $("#main").innerHTML = `<div class="panel about"><h2>Transparenz: wer sieht was, wer entscheidet</h2>
  <p>Der Kompetenz-Übersetzer verbindet drei Sprachen für dieselbe Sache: <b>Warum</b> (SBW Future Skills: Haltung), <b>Was</b> (FSH-Badgeraster, Anhang A: beobachtbares Handeln) und <b>Wozu</b> (Begriffe der Bildungsverordnungen: Sprache der Betriebe).</p></div>
  <div class="panel"><h2 style="font-size:17px">Wer entscheidet was</h2><div class="tblwrap" style="border:0"><table class="list"><thead><tr><th>Ebene</th><th>Entscheidet</th><th>Anbieter und Betriebe können</th></tr></thead><tbody>
    <tr><td>Modell (Badges, Indikatoren, Berufe)</td><td>Kuratorium der Bildungsinstitutionen</td><td>Rückmeldungen geben</td></tr>
    <tr><td>Zuordnungen Badge → SBW / BiVo</td><td>Kuratorium</td><td>Zuordnungen vorschlagen (Quelle bleibt sichtbar)</td></tr>
    <tr><td>Angebote der Lernorte</td><td>Anbieter erfassen; Kuratorium publiziert und vergibt das Siegel</td><td>Angebot einreichen und Badges begründen</td></tr>
  </tbody></table></div></div>
  <div class="panel"><h2 style="font-size:17px">Was gespeichert wird – und was nicht</h2><div class="tblwrap" style="border:0"><table class="list"><thead><tr><th>Daten</th><th>Gespeichert?</th><th>Wer sieht es</th></tr></thead><tbody>
    <tr><td>Daten über Schülerinnen und Schüler</td><td><b>Nein.</b> Diese Version speichert keine.</td><td>–</td></tr>
    <tr><td>Rückmeldungen und Vorschläge</td><td>Ja, mit Name und Organisation</td><td>Öffentlich nur Text und Rolle; Name nur das Kuratorium</td></tr>
    <tr><td>Angebote der Lernorte</td><td>Ja</td><td>Öffentlich erst nach Publikation; Kontaktangaben nur das Kuratorium</td></tr>
    <tr><td>Gewählte Demo-Rolle</td><td>Nur im eigenen Browser</td><td>niemand</td></tr>
  </tbody></table></div></div>
  <div class="panel about"><h2 style="font-size:17px">Leitplanken</h2><ul>
    <li>Entwicklungsinstrument, kein Selektionsinstrument. Betriebe sehen nie individuelle Profile.</li>
    <li>Keine Scores, Ampeln oder Rankings von Personen. Keine KI-generierten Zuordnungen.</li>
    <li>Zuordnungen sind Deutungen, keine Gleichungen. Lücken werden sichtbar gemacht.</li>
    <li>Ein Badge aus einem Workshop ist kein Qualifikationsnachweis im Sinne der Bildungsverordnung.</li>
  </ul>
  <h2 style="font-size:17px;margin-top:14px">Modelle und Quellen</h2>
  <ul><li>${esc(D.quellen.sbw)}</li><li>${esc(D.quellen.fsh)}</li><li>${esc(D.quellen.bivo)}</li></ul>
  <p style="color:var(--muted);font-size:13px">Die Badges «Neugier entdecken und verfolgen», «Nachhaltig denken und handeln» und «Unternehmergeist» sowie alle Zuordnungen und die Texte in einfacher Sprache sind Entwürfe. Lernort-Angebote mit dem Vermerk «Beispiel» sind frei erfunden.</p></div>`;
}

function render(flip) {
  if (!ROLES[S.role].views.includes(S.view) && S.view !== "transparenz" && !S.badge && !S.angebot) S.view = ROLES[S.role].views[0];
  renderTabs(); renderBar();
  if (S.badge) renderDetail();
  else if (S.view === "wand") renderWand(flip);
  else if (S.view === "lernorte") renderLernorte();
  else if (S.view === "erfassen") renderErfassen();
  else if (S.view === "beruf") renderBeruf();
  else if (S.view === "matrix") renderMatrix();
  else if (S.view === "zuordnungen") renderZuordnungen();
  else renderTransparenz();
}

let startRole = "lehrperson";
try { const r = localStorage.getItem("ku-role"); if (r && ROLES[r]) startRole = r; S.einfach = localStorage.getItem("ku-einfach") === "1"; } catch (e) {}
S.role = startRole; S.lesart = ROLES[startRole].lesart; S.view = ROLES[startRole].views[0];
render();
load();
</script>
</body>
