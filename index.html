<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kompetenz-Übersetzer · Future Skills Hub Thurgau</title>
<style>
:root{
  --ink:#1a1a1a; --muted:#5f5f5a; --line:#e2e0d8; --line2:#cfcdc3; --bg:#f4f3ee; --card:#fff;
  --focus:#1d5fbf;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:"Segoe UI",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45;}
button,select,input,textarea{font-family:inherit;font-size:inherit;}
button{cursor:pointer;}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;}

.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--line2);position:sticky;top:0;z-index:20;flex-wrap:wrap;}
.brand strong{font-size:18px;display:block;}
.brand .sub{font-size:12.5px;color:var(--muted);}
.tabs{display:flex;gap:6px;flex-wrap:wrap;}
.tab{border:1px solid var(--line2);background:#f6f5f1;border-radius:999px;padding:7px 16px;font-size:14px;color:#3d3d39;}
.tab[aria-current="page"]{background:var(--ink);color:#fff;border-color:var(--ink);}

.bar{display:flex;align-items:center;gap:12px;padding:10px 20px;background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap;}
.bar .lbl{font-size:13px;color:var(--muted);font-weight:600;}
.seg{display:flex;gap:4px;flex-wrap:wrap;}
.seg button{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:7px 13px;font-size:14px;}
.seg button[aria-pressed="true"]{background:#1a1a1a;color:#fff;border-color:#1a1a1a;}
.status{margin-left:auto;font-size:12.5px;color:var(--muted);}

main{max-width:1180px;margin:0 auto;padding:18px 20px 80px;}
.hint{background:#fff8e6;border:1px solid #ecd9a6;border-radius:10px;padding:10px 14px;font-size:13.5px;margin-bottom:14px;}
.hint b{font-weight:600;}

/* Bereiche + Kacheln */
.area{margin-bottom:22px;}
.areahead{display:flex;align-items:baseline;gap:10px;margin:0 0 8px;flex-wrap:wrap;}
.areahead h2{margin:0;font-size:17px;color:var(--c);letter-spacing:.04em;}
.areahead .u{font-size:13.5px;color:var(--muted);}
.areahead .m{font-size:12px;color:var(--muted);margin-left:auto;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;}
.tile{perspective:900px;}
.tilebtn{all:unset;box-sizing:border-box;display:block;width:100%;height:100%;cursor:pointer;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:12px;padding:14px 14px 12px;transition:box-shadow .12s, transform .35s;transform-style:preserve-3d;}
.tilebtn:hover{box-shadow:0 2px 10px rgba(0,0,0,.08);}
.tilebtn:focus-visible{outline:3px solid var(--focus);outline-offset:2px;}
.tilebtn.flip{animation:flip .35s ease;}
@keyframes flip{0%{transform:rotateY(0)}50%{transform:rotateY(90deg)}100%{transform:rotateY(0)}}
.tile h3{margin:0 0 6px;font-size:15.5px;}
.tile .du{font-size:14px;color:#33332f;}
.tile ul{margin:4px 0 0;padding-left:18px;font-size:13.5px;}
.tile .small{font-size:12px;color:var(--muted);margin-top:8px;}
.chip{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px;margin:0 4px 4px 0;}
.chip.entwurf{background:#fff1cc;color:#7a5a00;}
.chip.neu{background:#e3eefb;color:#1d4f8f;}
.chip.meta{background:#ecebe6;color:#3d3d39;}
.chip.besch{background:#e2f2e7;color:#1f6b40;}
.maprow{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;margin:4px 0;}
.sym{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;border-radius:6px;font-weight:700;font-size:13px;flex:none;}
.sym.entspricht{background:#e2f2e7;color:#1f6b40;}
.sym.traegt_bei{background:#e3eefb;color:#1d4f8f;}
.sym.keine{background:#f1efea;color:#6b6b66;}
.dim{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:6px;}
.disclaim{font-size:12px;color:#6b4e00;background:#fff8e6;border-radius:8px;padding:6px 9px;margin-top:8px;}

/* Detail */
.detail{background:var(--card);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:14px;overflow:hidden;}
.dhead{display:flex;align-items:flex-start;gap:12px;padding:16px 20px;background:var(--cbg);flex-wrap:wrap;}
.dhead h2{margin:0;font-size:21px;flex:1;min-width:240px;}
.dhead .du{font-size:15px;margin-top:6px;font-weight:400;}
.back{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:8px 14px;font-size:14px;}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:0;}
.col{padding:16px 20px;border-top:1px solid var(--line);}
.col+.col{border-left:1px solid var(--line);}
.col h3{margin:0 0 2px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);}
.col .q{font-size:17px;font-weight:600;margin:0 0 10px;}
.mapcard{border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:8px;}
.mapcard .t{font-weight:600;font-size:14.5px;}
.mapcard .b{font-size:13px;color:var(--muted);margin-top:3px;}
.zyk{display:flex;gap:4px;margin-bottom:8px;}
.zyk button{border:1px solid var(--line2);background:#fff;border-radius:7px;padding:4px 10px;font-size:13px;}
.zyk button[aria-pressed="true"]{background:#1a1a1a;color:#fff;border-color:#1a1a1a;}
.section{padding:16px 20px;border-top:1px solid var(--line);}
.section h3{margin:0 0 8px;font-size:15px;}
.fb{background:#f8f7f3;border-radius:9px;padding:9px 12px;margin-bottom:7px;font-size:14px;}
.fb .meta{font-size:12px;color:var(--muted);}
form.rm{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;max-width:760px;}
form.rm label{display:flex;flex-direction:column;font-size:13px;color:#3d3d39;gap:4px;}
form.rm .full{grid-column:1/-1;}
form.rm input,form.rm select,form.rm textarea{border:1px solid var(--line2);border-radius:8px;padding:8px 10px;background:#fff;font-size:14px;}
form.rm textarea{min-height:80px;resize:vertical;}
.primary{background:#1a1a1a;color:#fff;border:0;border-radius:8px;padding:9px 16px;font-size:14px;}
.msg{font-size:13.5px;margin-top:6px;}

/* Beruf + Matrix */
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin-bottom:14px;}
.panel h2{margin:0 0 4px;font-size:19px;}
.panel .sub{font-size:13.5px;color:var(--muted);}
.brow{display:grid;grid-template-columns:minmax(220px,1fr) 2fr;gap:12px;padding:9px 0;border-top:1px solid var(--line);align-items:start;}
.brow .begr{font-weight:600;font-size:14.5px;}
.bl{display:flex;flex-wrap:wrap;gap:6px;}
.bpill{border:1px solid var(--line2);background:#fff;border-left:4px solid var(--c);border-radius:8px;padding:4px 9px;font-size:13px;display:inline-flex;gap:6px;align-items:center;}
.gap{font-size:13px;color:#8a3b3b;font-style:italic;}
.tblwrap{overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;}
table.mx{border-collapse:collapse;font-size:13px;min-width:900px;}
table.mx th,table.mx td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:center;}
table.mx th{position:sticky;top:0;background:#faf9f6;font-weight:600;font-size:12px;}
table.mx th.v{writing-mode:vertical-rl;transform:rotate(180deg);height:150px;white-space:nowrap;text-align:left;}
table.mx td.l,table.mx th.l{text-align:left;white-space:nowrap;}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:10px 0;align-items:center;}
.about p,.about li{font-size:14.5px;max-width:820px;}
footer{font-size:12px;color:var(--muted);text-align:center;padding:24px 20px;}
@media (max-width:820px){.cols{grid-template-columns:1fr}.col+.col{border-left:0}form.rm{grid-template-columns:1fr}.brow{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.tilebtn.flip{animation:none}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><strong>Kompetenz-Übersetzer</strong><span class="sub">SBW Future Skills × FSH-Badgeraster × Berufsbildung · Prototyp</span></div>
  <nav class="tabs" aria-label="Ansichten">
    <button class="tab" data-view="wand">Kachelwand</button>
    <button class="tab" data-view="beruf">Berufsansicht</button>
    <button class="tab" data-view="matrix">Matrix</button>
    <button class="tab" data-view="about">Über</button>
  </nav>
</header>
<div class="bar" id="bar"></div>
<main id="main" tabindex="-1"></main>
<footer>Future Skills Hub Thurgau · Prototyp · SBW Future Skills™ © SBW Haus des Lernens · Badgeraster: FSH Anhang A</footer>

<script src="daten.js"></script>
<script>
const D = window.DATEN;
const S = { view: "wand", lesart: "du", zyklus: "z3", bereich: "alle", badge: null, beruf: "allgemein", source: "lädt …" };
let ZUO = D.zuordnungen.slice();
let RM = [];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const area = id => D.bereiche.find(b => b.id === id);
const sbwById = id => D.sbw.find(x => x.id === id);
const badgeById = id => D.badges.find(x => x.id === id);
const dimOf = b => (D.begriffe.find(x => x.b === b) || {}).d || "–";
const SYM = { entspricht: "=", traegt_bei: "→", keine: "∅" };
const TYPTXT = { entspricht: "entspricht", traegt_bei: "trägt bei zu", keine: "keine Entsprechung" };
const DISCLAIM = "Ein Badge aus einem Workshop belegt eine beobachtete Handlung in einer konkreten Situation. Es ist kein Qualifikationsnachweis im Sinne der Bildungsverordnung.";
const maps = (badge, ebene) => ZUO.filter(z => z.badge === badge && z.ebene === ebene);
const statusChip = s => s === "beschlossen" ? '<span class="chip besch">beschlossen</span>' : '<span class="chip entwurf">' + esc(s || "Entwurf") + '</span>';
const sym = t => `<span class="sym ${t}" title="${TYPTXT[t]}" aria-label="${TYPTXT[t]}">${SYM[t]}</span>`;

async function load() {
  try {
    const r = await fetch("/api/data?op=zuordnungen");
    const d = await r.json();
    if (d.fallback) S.source = "Demo-Daten (Airtable nicht verbunden)";
    else if (d.zuordnungen) { ZUO = d.zuordnungen; S.source = "Zuordnungen aus Airtable"; }
    else S.source = "Fehler – Demo-Daten";
  } catch (e) { S.source = "lokal – Demo-Daten"; }
  try {
    const r = await fetch("/api/data?op=rueckmeldungen");
    const d = await r.json();
    RM = d.rueckmeldungen || [];
  } catch (e) { RM = []; }
  render();
}

function setView(v) { S.view = v; S.badge = null; render(); $("#main").focus(); window.scrollTo(0, 0); }
document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => setView(t.dataset.view)));

function seg(name, opts, cur, attr) {
  return `<span class="lbl">${name}</span><div class="seg" role="group" aria-label="${name}">` +
    opts.map(([v, l]) => `<button data-${attr}="${v}" aria-pressed="${v === cur}">${l}</button>`).join("") + `</div>`;
}

function renderBar() {
  const bar = $("#bar");
  if (S.view === "wand" && !S.badge) {
    bar.innerHTML = seg("Lesart", [["du","Für dich"],["schule","Schule"],["sbw","Haltung (SBW)"],["betrieb","Betrieb"]], S.lesart, "lesart") +
      (S.lesart === "schule" ? seg("Zyklus", [["z2","Zyklus 2"],["z3","Zyklus 3"]], S.zyklus, "zyklus") : "") +
      seg("Bereich", [["alle","alle"], ...D.bereiche.map(b => [b.id, b.name])], S.bereich, "bereich") +
      `<span class="status">${esc(S.source)}</span>`;
  } else {
    bar.innerHTML = `<span class="status">${esc(S.source)}</span>`;
  }
  bar.querySelectorAll("[data-lesart]").forEach(b => b.onclick = () => { S.lesart = b.dataset.lesart; render(true); });
  bar.querySelectorAll("[data-zyklus]").forEach(b => b.onclick = () => { S.zyklus = b.dataset.zyklus; render(true); });
  bar.querySelectorAll("[data-bereich]").forEach(b => b.onclick = () => { S.bereich = b.dataset.bereich; render(); });
}

function tileBody(b) {
  const a = area(b.bereich);
  let chips = (b.herkunft === "neu" ? '<span class="chip neu">neu</span>' : "") + (b.status !== "beschlossen" ? '<span class="chip entwurf">Entwurf</span>' : "") + (b.meta ? '<span class="chip meta">Meta-Badge</span>' : "");
  let body = "";
  if (S.lesart === "du") {
    body = `<div class="du">${esc(b.du)}</div>`;
  } else if (S.lesart === "schule") {
    const ind = b[S.zyklus] || [];
    body = b.meta ? `<div class="du">${esc(b.regel)}</div>` :
      `<div class="dim">Indikatoren ${S.zyklus === "z2" ? "Zyklus 2" : "Zyklus 3"}</div><ul>${ind.map(i => `<li>${esc(i)}</li>`).join("")}</ul>`;
    body += `<div class="small">Lehrplan 21: ${esc(a.lp21)}</div>`;
  } else if (S.lesart === "sbw") {
    const m = maps(b.id, "sbw");
    body = m.length ? m.map(z => z.typ === "keine"
      ? `<div class="maprow">${sym("keine")}<span>keine Entsprechung im SBW-Modell</span></div>`
      : `<div class="maprow">${sym(z.typ)}<span><b>${esc(sbwById(z.ziel)?.name || z.ziel)}</b><br><span class="small">${esc(sbwById(z.ziel)?.ziel || "")}</span></span></div>`).join("")
      : `<div class="maprow">${sym("keine")}<span>noch keine Zuordnung</span></div>`;
  } else {
    const m = maps(b.id, "bivo");
    const byDim = {};
    m.forEach(z => { const d = dimOf(z.ziel); (byDim[d] = byDim[d] || []).push(z); });
    body = Object.keys(byDim).length ? Object.entries(byDim).map(([d, zs]) => `<div class="dim">${esc(d)}</div>` +
      zs.map(z => `<div class="maprow">${sym(z.typ)}<span>${esc(z.ziel)}</span></div>`).join("")).join("")
      : `<div class="maprow">${sym("keine")}<span>noch keine Zuordnung</span></div>`;
  }
  return `<div>${chips}</div><h3>${esc(b.titel)}</h3>${body}`;
}

function renderWand(flip) {
  const areas = D.bereiche.filter(a => S.bereich === "alle" || a.id === S.bereich);
  let h = "";
  if (S.lesart === "betrieb") h += `<div class="hint"><b>Hinweis:</b> ${DISCLAIM}</div>`;
  if (S.lesart === "sbw") h += `<div class="hint"><b>Haltungsebene:</b> Die SBW Future Skills beschreiben Antrieb und Haltung («Wollen»). Sie werden nicht vergeben, sondern geben dem beobachtbaren Handeln einen Sinn.</div>`;
  areas.forEach(a => {
    const bs = D.badges.filter(b => b.bereich === a.id);
    if (!bs.length) return;
    const sbwN = a.sbw.map(id => sbwById(id)?.name).filter(Boolean).join(", ") || "keine SBW-Entsprechung";
    h += `<section class="area" style="--c:${a.farbe}"><div class="areahead"><h2>${a.name}</h2><span class="u">${esc(a.untertitel)}</span><span class="m">SBW: ${esc(sbwN)} · BiVo: ${esc(a.bivo)}</span></div><div class="grid">` +
      bs.map(b => `<div class="tile"><button class="tilebtn${flip ? " flip" : ""}" style="--c:${a.farbe}" data-badge="${b.id}" aria-label="${esc(b.titel)} – Details öffnen">${tileBody(b)}</button></div>`).join("") +
      `</div></section>`;
  });
  $("#main").innerHTML = h;
  document.querySelectorAll("[data-badge]").forEach(el => el.onclick = () => { S.badge = el.dataset.badge; render(); $("#main").focus(); window.scrollTo(0, 0); });
}

function renderDetail() {
  const b = badgeById(S.badge), a = area(b.bereich);
  const sbwM = maps(b.id, "sbw"), bivoM = maps(b.id, "bivo");
  const card = (z, title, sub) => `<div class="mapcard"><div class="maprow">${sym(z.typ)}<div><div class="t">${esc(title)}</div>${sub ? `<div class="b">${esc(sub)}</div>` : ""}<div class="b">${TYPTXT[z.typ]} · ${statusChip(z.status)}</div>${z.begruendung ? `<div class="b">Begründung: ${esc(z.begruendung)}</div>` : ""}</div></div></div>`;
  const ind = z => (b[z] || []).map(i => `<li>${esc(i)}</li>`).join("");
  const rms = RM.filter(r => r.badge === b.id);
  const ziele = [...D.sbw.map(s => `<option value="sbw|${s.id}">SBW: ${esc(s.name)}</option>`), ...D.begriffe.map(x => `<option value="bivo|${esc(x.b)}">BiVo: ${esc(x.b)}</option>`)].join("");
  $("#main").innerHTML = `
  <article class="detail" style="--c:${a.farbe};--cbg:${a.bg}">
    <div class="dhead"><h2>${esc(b.titel)}<div class="du">${esc(b.du)}</div></h2><button class="back" id="back">← zurück zur Kachelwand</button></div>
    <div class="cols">
      <div class="col"><h3>Warum</h3><p class="q">Haltung (SBW)</p>
        ${sbwM.length ? sbwM.map(z => z.typ === "keine" ? card(z, "keine Entsprechung im SBW-Modell", "") : card(z, sbwById(z.ziel)?.name || z.ziel, sbwById(z.ziel)?.ziel)).join("") : '<p class="b">noch keine Zuordnung</p>'}
      </div>
      <div class="col"><h3>Was</h3><p class="q">Beobachtbares Handeln (Raster)</p>
        ${b.meta ? `<p>${esc(b.regel)}</p>` : `
        <div class="zyk" role="group" aria-label="Zyklus"><button data-z="z2" aria-pressed="${S.zyklus==="z2"}">Zyklus 2</button><button data-z="z3" aria-pressed="${S.zyklus==="z3"}">Zyklus 3</button></div>
        <ul>${ind(S.zyklus)}</ul>`}
        <p class="b" style="font-size:13px;color:var(--muted)">Bereich ${esc(a.name)} · Lehrplan 21: ${esc(a.lp21)} · Herkunft: ${esc(b.herkunft)} · ${statusChip(b.status)}</p>
      </div>
      <div class="col"><h3>Wozu</h3><p class="q">Betrieb (BiVo-Begriffe)</p>
        ${bivoM.length ? bivoM.map(z => card(z, z.ziel, dimOf(z.ziel))).join("") : '<p class="b">noch keine Zuordnung</p>'}
        <div class="disclaim">${DISCLAIM}</div>
      </div>
    </div>
    <div class="section"><h3>Rückmeldungen (${rms.length})</h3>
      ${rms.length ? rms.map(r => `<div class="fb"><b>${esc(r.art)}</b>${r.ziel ? " · " + esc(r.ebene === "sbw" ? (sbwById(r.ziel)?.name || r.ziel) : r.ziel) + (r.typ ? " (" + TYPTXT[r.typ] + ")" : "") : ""}<div>${esc(r.text)}</div><div class="meta">${esc(r.rolle)} · ${esc(r.status)}${r.datum ? " · " + new Date(r.datum).toLocaleDateString("de-CH") : ""}</div></div>`).join("") : '<p class="b" style="font-size:13.5px;color:var(--muted)">Noch keine Rückmeldungen.</p>'}
    </div>
    <div class="section"><h3>Zuordnung vorschlagen oder kommentieren</h3>
      <p style="font-size:13.5px;color:var(--muted);margin-top:0">Vorschläge gehen an das Kuratorium (Bildungsinstitutionen). Es entscheidet über die Aufnahme. Namen werden nicht öffentlich angezeigt.</p>
      <form class="rm" id="rm">
        <label>Art<select name="art"><option>Vorschlag</option><option>Kommentar</option></select></label>
        <label>Rolle<select name="rolle"><option value="lehrperson">Lehrperson</option><option value="anbieter">Workshopanbieter</option><option value="kmu">KMU / Betrieb</option><option value="andere">andere</option></select></label>
        <label class="vz">Ziel der Zuordnung<select name="ziel">${ziele}</select></label>
        <label class="vz">Typ<select name="typ"><option value="entspricht">entspricht</option><option value="traegt_bei">trägt bei zu</option><option value="keine">keine Entsprechung</option></select></label>
        <label class="full">Begründung / Kommentar<textarea name="text" required></textarea></label>
        <label>Name<input name="name" required autocomplete="name"></label>
        <label>Organisation<input name="organisation" autocomplete="organization"></label>
        <div class="full"><button class="primary" type="submit">Absenden</button><div class="msg" id="rmmsg" role="status"></div></div>
      </form>
    </div>
  </article>`;
  $("#back").onclick = () => { S.badge = null; render(); };
  document.querySelectorAll("[data-z]").forEach(x => x.onclick = () => { S.zyklus = x.dataset.z; renderDetail(); });
  const f = $("#rm");
  const toggle = () => f.querySelectorAll(".vz").forEach(x => x.style.display = f.art.value === "Vorschlag" ? "" : "none");
  f.art.onchange = toggle; toggle();
  f.onsubmit = async e => {
    e.preventDefault();
    const [ebene, ziel] = f.ziel.value.split("|");
    const body = { art: f.art.value, badge: b.id, text: f.text.value, name: f.name.value, organisation: f.organisation.value, rolle: f.rolle.value };
    if (body.art === "Vorschlag") Object.assign(body, { ebene, ziel, typ: f.typ.value });
    const msg = $("#rmmsg"); msg.textContent = "wird gesendet …";
    try {
      const r = await fetch("/api/data?op=rueckmeldung", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      const d = await r.json();
      if (d.fallback) { msg.textContent = "Demo-Modus: Airtable ist nicht verbunden, die Rückmeldung wurde nicht gespeichert."; return; }
      if (!r.ok) throw new Error(d.error || "Fehler");
      msg.textContent = "Danke! Die Rückmeldung ist beim Kuratorium eingegangen.";
      f.text.value = "";
      RM.push({ ...body, ebene: body.ebene || "", status: "offen", datum: new Date().toISOString(), rolle: body.rolle });
    } catch (err) { msg.textContent = "Konnte nicht gesendet werden: " + err.message; }
  };
}

function renderBeruf() {
  const be = D.berufe.find(x => x.id === S.beruf);
  const begriffe = be.alle ? D.begriffe.map(x => x.b) : be.begriffe;
  const dims = ["Methodenkompetenz", "Sozial- und Selbstkompetenz", "Fachkompetenz"];
  let h = `<div class="panel"><h2>Berufsansicht</h2><div class="sub">Welche Badges zahlen auf die Handlungskompetenzen eines Berufs ein? Lücken werden bewusst gezeigt.</div>
    <div style="margin-top:12px"><label class="lbl" for="bsel" style="font-size:13px;color:var(--muted);font-weight:600">Beruf </label>
    <select id="bsel" style="border:1px solid var(--line2);border-radius:8px;padding:7px 10px;font-size:14px">${D.berufe.map(x => `<option value="${x.id}" ${x.id === S.beruf ? "selected" : ""}>${esc(x.name)}</option>`).join("")}</select></div>
    <div class="sub" style="margin-top:8px">Quelle: ${esc(be.erlass)}${be.stand ? " · " + esc(be.stand) : ""}${be.alle ? "" : " · Auszug als Beispieldaten – vor Einsatz am Originalerlass prüfen"}</div>
    <div class="disclaim">${DISCLAIM}</div></div>`;
  dims.forEach(d => {
    const bs = begriffe.filter(x => dimOf(x) === d);
    if (!bs.length) return;
    h += `<div class="panel"><h2 style="font-size:16px">${esc(d)}</h2>` + bs.map(begr => {
      const zs = ZUO.filter(z => z.ebene === "bivo" && z.ziel === begr && z.typ !== "keine");
      return `<div class="brow"><div class="begr">${esc(begr)}</div><div class="bl">${zs.length ? zs.map(z => { const b = badgeById(z.badge); if (!b) return ""; const a = area(b.bereich);
        return `<button class="bpill" style="--c:${a.farbe}" data-badge="${b.id}">${sym(z.typ)} ${esc(b.titel)}</button>`; }).join("") : '<span class="gap">Lücke: kein Badge zahlt hier ein</span>'}</div></div>`;
    }).join("") + `</div>`;
  });
  $("#main").innerHTML = h;
  $("#bsel").onchange = e => { S.beruf = e.target.value; renderBeruf(); };
  document.querySelectorAll("[data-badge]").forEach(el => el.onclick = () => { S.view = "wand"; S.badge = el.dataset.badge; render(); window.scrollTo(0,0); });
}

function matrixData() {
  const cols = [...D.sbw.map(s => ({ key: "sbw|" + s.id, label: "SBW: " + s.name })), ...D.begriffe.map(x => ({ key: "bivo|" + x.b, label: x.b }))];
  const rows = D.badges.map(b => ({ b, cells: cols.map(c => { const [e, t] = c.key.split("|"); const z = ZUO.find(z => z.badge === b.id && z.ebene === e && z.ziel === t); return z ? z.typ : ""; }) }));
  return { cols, rows };
}

function renderMatrix() {
  const { cols, rows } = matrixData();
  let h = `<div class="panel"><h2>Übersetzungs-Matrix</h2><div class="sub">Badges (Zeilen) × SBW Future Skills und BiVo-Begriffe (Spalten).</div>
    <div class="legend">${sym("entspricht")} entspricht ${sym("traegt_bei")} trägt bei zu <span>Badges ohne SBW-Entsprechung: ${rows.filter(r => maps(r.b.id, "sbw").some(z => z.typ === "keine")).map(r => esc(r.b.titel)).join(", ") || "–"}</span>
    <button class="back" id="csv" style="margin-left:auto">CSV exportieren</button></div></div>
    <div class="tblwrap"><table class="mx"><thead><tr><th class="l">Badge</th>${cols.map(c => `<th class="v" scope="col">${esc(c.label)}</th>`).join("")}</tr></thead><tbody>` +
    rows.map(r => `<tr><th class="l" scope="row"><button class="bpill" style="--c:${area(r.b.bereich).farbe}" data-badge="${r.b.id}">${esc(r.b.titel)}</button></th>${r.cells.map(t => `<td>${t && t !== "keine" ? sym(t) : ""}</td>`).join("")}</tr>`).join("") +
    `</tbody></table></div>`;
  $("#main").innerHTML = h;
  document.querySelectorAll("[data-badge]").forEach(el => el.onclick = () => { S.view = "wand"; S.badge = el.dataset.badge; render(); window.scrollTo(0,0); });
  $("#csv").onclick = () => {
    const q = s => '"' + String(s).replace(/"/g, '""') + '"';
    const lines = [["Badge", "Bereich", ...cols.map(c => c.label)].map(q).join(";"),
      ...rows.map(r => [r.b.titel, area(r.b.bereich).name, ...r.cells.map(t => t ? TYPTXT[t] : "")].map(q).join(";"))];
    const blob = new Blob(["﻿" + lines.join("\n")], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "kompetenz-uebersetzer-matrix.csv"; a.click();
  };
}

function renderAbout() {
  $("#main").innerHTML = `<div class="panel about"><h2>Worum es geht</h2>
  <p>Der Kompetenz-Übersetzer verbindet drei Sprachen für dieselbe Sache:</p>
  <ul>
    <li><b>Warum</b> – SBW Future Skills: Haltung und Antrieb. Diese Ebene wird gelesen, nicht vergeben.</li>
    <li><b>Was</b> – Badgeraster des Future Skills Hub Thurgau (Anhang A): beobachtbare Handlungen mit Indikatoren für Zyklus 2 und 3. Hier wird vergeben.</li>
    <li><b>Wozu</b> – Begriffe der Bildungsverordnungen (Methoden-, Sozial- und Selbstkompetenz, Fachkompetenz): die Sprache der Betriebe.</li>
  </ul>
  <h2 style="margin-top:18px">Leitplanken</h2>
  <ul>
    <li>Ein Entwicklungsinstrument, kein Selektionsinstrument. Diese Version speichert keine Daten über Schülerinnen und Schüler.</li>
    <li>Keine Scores, Ampeln oder Rankings. Keine KI-generierten Zuordnungen.</li>
    <li>Zuordnungen sind Deutungen, keine Gleichungen. Lücken werden sichtbar gemacht.</li>
    <li>Steuerhoheit bei den Bildungsinstitutionen (Kuratorium). Anbieter und Betriebe können Zuordnungen vorschlagen.</li>
  </ul>
  <h2 style="margin-top:18px">Quellen</h2>
  <ul><li>${esc(D.quellen.sbw)}</li><li>${esc(D.quellen.fsh)}</li><li>${esc(D.quellen.bivo)}</li></ul>
  <p style="color:var(--muted);font-size:13px">Die Badges «Neugier entdecken und verfolgen», «Nachhaltig denken und handeln» und «Unternehmergeist» sowie alle Zuordnungen sind Entwürfe.</p></div>`;
}

function render(flip) {
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-current", t.dataset.view === S.view ? "page" : "false"));
  renderBar();
  if (S.view === "wand") S.badge ? renderDetail() : renderWand(flip);
  else if (S.view === "beruf") renderBeruf();
  else if (S.view === "matrix") renderMatrix();
  else renderAbout();
}

render();
load();
</script>
</body>
</html>
